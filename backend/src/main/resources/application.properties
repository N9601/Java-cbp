spring.application.name=share-market-portfolio
server.port=${PORT:8080}
spring.main.banner-mode=off

# Database credentials and simulator settings come from db.properties
# (git-ignored). Copy db.properties.example to db.properties to start.
spring.config.import=optional:file:./db.properties

# Defaults, used only when db.properties does not set a key.
db.url=jdbc:mysql://localhost:3306/share_market
db.user=root
db.password=

simulator.enabled=true
simulator.interval.seconds=5
simulator.max.change.percent=2
simulator.history.retention.days=30
wallet.initial.balance=100000

app.seed.demo=true
app.session.ttl.hours=168

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/csv,image/svg+xml

logging.level.com.sharemarket=INFO
